<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contactez le Foot Fauteuil Villeneuve d'Ascq.">
  <title>Contact - FFVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="home-visual page-visual contact-visual">
    <header class="site-header" id="accueil">
      <img class="header-logo" src="media/Logo-FFVA.png" alt="Logo Foot Fauteuil Villeneuve d'Ascq">
      <div class="nav-wrap">
        <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="main-nav" id="site-nav" aria-label="Navigation principale">
          <a href="index.html">Accueil</a>
          <a href="le-foot-fauteuil.html">Le foot fauteuil</a>
          <a href="Effectif.html">Effectif</a>
          <a href="Calendrier.html">Calendrier</a>
          <a href="Classement.html">Classement</a>
          <a class="is-active" href="Contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <p class="page-title">Contact</p>
  </div>

  <main class="contact-page">
    <section class="contact-shell" aria-labelledby="contact-title">
      <div class="contact-heading">
        <p class="section-kicker">Nous contacter</p>
        <h1 id="contact-title">Une question,<br> une inscription, un don ?</h1>
        <p>Envoyez-nous un message, le club vous recontactera rapidement.</p>
      </div>

      <div class="contact-layout">
        <form class="contact-form" action="mailto:villeneuvedascq@ff-va.fr" method="post" enctype="text/plain">
          <div class="form-row">
            <label for="contact-name">Nom</label>
            <input id="contact-name" name="Nom" type="text" autocomplete="name" required>
          </div>

          <div class="form-row">
            <label for="contact-email">Mail</label>
            <input id="contact-email" name="Mail" type="email" autocomplete="email" required>
          </div>

          <div class="form-row">
            <label for="contact-subject">Sujet</label>
            <input id="contact-subject" name="Sujet" type="text" required>
          </div>

          <div class="form-row">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="Message" rows="7" required></textarea>
          </div>

          <button class="button primary" type="submit">Envoyer le message</button>
        </form>

        <aside class="contact-info" aria-label="Informations de contact">
          <h2>Foot Fauteuil Villeneuve d'Ascq</h2>
          <p>BP 90054 - 59652 Villeneuve d'Ascq</p>
          <a href="mailto:villeneuvedascq@ff-va.fr">villeneuvedascq@ff-va.fr</a>
        </aside>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
